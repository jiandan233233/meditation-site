  <!-- 主内容 -->
  <main class="main-content">
    <div class="page-banner"></div>

    <div class="container">
      <p class="section-desc">霎哈嘉瑜伽音乐，纯净的音频与视频，助你进入冥想状态。</p>

      <!-- 子分类切换 -->
      <div class="filter-bar" style="margin-bottom: 16px;">
        <div class="filter-tags">
          <span class="filter-tag active" data-subtype="audio" onclick="switchSubtype('audio')">🎶 音乐音频</span>
          <span class="filter-tag" data-subtype="video" onclick="switchSubtype('video')">🎹 音乐视频</span>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()">🌓 暗黑模式</button>
      </div>

      <div class="search-box">
        <input type="text" class="search-input" id="searchInput" placeholder="搜索音乐标题或关键词...">
        <button class="search-btn" onclick="performSearch()">搜索</button>
      </div>

      <div class="filter-bar">
        <div class="filter-tags" id="filterTags"></div>
      </div>

      <div id="loadingState" style="text-align:center;padding:40px;color:var(--text-muted);">
        ⏳ 正在加载内容...
      </div>

      <div class="content-list" id="contentList" style="display:none;"></div>

      <div class="pagination" id="pagination"></div>
    </div>
  </main>

  <footer style="text-align:center;padding:24px 20px;color:var(--text-muted);font-size:13px;border-top:1px solid var(--border-color);">
    © 2026 Sahaja Yoga · Free Meditation Resources <a href="admin.html" style="color:var(--nav-blue);text-decoration:none;font-size:13px;margin-left:8px;" title="创作者工作台">✎ 创作者入口</a>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    const PAGE_SIZE = 10;
    let currentPage = 1;
    let currentSubtype = 'audio';
    let filteredData = [];
    let allCategories = [];

    document.addEventListener('DOMContentLoaded', function() {
      // 检查URL hash
      const hash = window.location.hash.replace('#', '');
      if (hash === 'video') {
        switchSubtype('video');
      }
      initPage();
    });

    async function initPage() {
      try {
        const content = await fetchContentJson();
        const dataKey = currentSubtype === 'audio' ? 'music_audio' : 'music_video';
        const data = content[dataKey] || [];
        
        saveAllData(dataKey, data);
        filteredData = data;
        allCategories = getCategories(dataKey);
        
        renderFilterTags(allCategories, document.getElementById('filterTags'), filterByCategory);
        
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('contentList').style.display = 'block';
        
        renderPage(1);
      } catch (e) {
        console.error('加载失败:', e);
        document.getElementById('loadingState').innerHTML = '⚠️ 加载失败，请刷新重试';
      }
      
      document.getElementById('searchInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          performSearch();
        }
      });
    }

    function switchSubtype(subtype) {
      currentSubtype = subtype;
      currentPage = 1;
      
      // 更新标签样式
      document.querySelectorAll('.filter-tag[data-subtype]').forEach(tag => {
        tag.classList.toggle('active', tag.dataset.subtype === subtype);
      });
      
      // 更新底部导航高亮
      document.querySelectorAll('.nav-item-small').forEach(link => {
        if (link.getAttribute('href') === `music.html#${subtype}`) {
          link.classList.add('active');
        } else {
          link.classList.remove('active');
        }
      });
      
      // 重新加载数据
      document.getElementById('loadingState').style.display = 'block';
      document.getElementById('contentList').style.display = 'none';
      initPage();
    }

    function filterByCategory(category) {
      const dataKey = currentSubtype === 'audio' ? 'music_audio' : 'music_video';
      if (!category) {
        filteredData = getAllData(dataKey);
      } else {
        filteredData = getAllData(dataKey).filter(item => item.category === category);
      }
      renderPage(1);
    }

    function performSearch() {
      const keyword = document.getElementById('searchInput').value.trim();
      const dataKey = currentSubtype === 'audio' ? 'music_audio' : 'music_video';
      filteredData = searchData(dataKey, keyword);
      renderPage(1);
    }

    function renderPage(page) {
      currentPage = page;
      const start = (page - 1) * PAGE_SIZE;
      const end = start + PAGE_SIZE;
      const pageData = filteredData.slice(start, end);
      
      const container = document.getElementById('contentList');
      if (pageData.length === 0) {
        container.innerHTML = '<div class="empty-state">暂无内容</div>';
      } else {
        renderContentList(pageData, container);
      }
      
      renderPagination(filteredData.length, page, PAGE_SIZE, document.getElementById('pagination'), renderPage);
    }

    function renderContentList(items, container) {
      if (!container) return;
      
      if (!items || items.length === 0) {
        container.innerHTML = '<div class="empty-state">暂无内容</div>';
        return;
      }

      const icon = currentSubtype === 'audio' ? '🎶' : '🎹';
      const type = currentSubtype === 'audio' ? 'music_audio' : 'music_video';
      const categoryLabel = currentSubtype === 'audio' ? '音乐音频' : '音乐视频';

      container.innerHTML = items.map(item => `
        <div class="content-item" onclick="goToDetail('${item.id}', '${type}')">
          <div class="item-header">
            <span class="item-category">${icon} ${item.category || categoryLabel}</span>
            <span class="item-date">${item.date}</span>
          </div>
          <span class="item-title">${item.title}</span>
          ${item.summary ? `<div class="item-summary">${item.summary}</div>` : ''}
        </div>
      `).join('');
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      if (current === 'dark') {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
      }
    }
  </script>
</body>
</html>
