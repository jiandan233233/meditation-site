<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sahaja Yoga - 冥想资源平台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 导航栏 -->
  <nav class="navbar">
    <a href="index.html" class="navbar-brand">SAHAJA YOGA</a>
    <button class="menu-toggle">☰</button>
    <div class="navbar-menu">
      <a href="index.html" class="nav-item active">首页</a>
      <a href="lectures.html" class="nav-item">讲座</a>
      <a href="videos.html" class="nav-item">视频</a>
      <a href="audios.html" class="nav-item">音频</a>
      <a href="images.html" class="nav-item">图片</a>
      <a href="literature.html" class="nav-item">经典文献</a>
      <a href="activities.html" class="nav-item">活动分享</a>
      <a href="downloads.html" class="nav-item">下载资料</a>
      <a href="about.html" class="nav-item">关于</a>
    </div>
  </nav>

  <!-- 主内容 -->
  <main class="main-content">
    <!-- 顶部横幅 -->
    <div class="hero-banner">
      <h1>宁静致远 · 觉察当下</h1>
    </div>

    <div class="container">
      <!-- 搜索框 -->
      <div class="search-box">
        <input type="text" class="search-input" id="globalSearch" placeholder="搜索讲座、视频、文献...">
        <button class="search-btn" onclick="globalSearch()">搜索</button>
      </div>

      <!-- 讲座 -->
      <div class="section-preview">
        <div class="section-header">
          <h2 class="section-title">讲座</h2>
          <a href="lectures.html" class="view-more">查看更多 →</a>
        </div>
        <div class="content-list" id="lecturesList"></div>
      </div>

      <!-- 视频 -->
      <div class="section-preview">
        <div class="section-header">
          <h2 class="section-title">视频</h2>
          <a href="videos.html" class="view-more">查看更多 →</a>
        </div>
        <div class="content-list" id="videosList"></div>
      </div>

      <!-- 音频 -->
      <div class="section-preview">
        <div class="section-header">
          <h2 class="section-title">音频</h2>
          <a href="audios.html" class="view-more">查看更多 →</a>
        </div>
        <div class="content-list" id="audiosList"></div>
      </div>

      <!-- 图片 -->
      <div class="section-preview">
        <div class="section-header">
          <h2 class="section-title">图片</h2>
          <a href="images.html" class="view-more">查看更多 →</a>
        </div>
        <div class="image-grid-preview" id="imagesList"></div>
      </div>

      <!-- 经典文献 -->
      <div class="section-preview">
        <div class="section-header">
          <h2 class="section-title">经典文献文库</h2>
          <a href="literature.html" class="view-more">查看更多 →</a>
        </div>
        <div class="content-list" id="literatureList"></div>
      </div>

      <!-- 各地活动 -->
      <div class="section-preview">
        <div class="section-header">
          <h2 class="section-title">各地活动分享</h2>
          <a href="activities.html" class="view-more">查看更多 →</a>
        </div>
        <div class="content-list" id="activitiesList"></div>
      </div>

      <!-- 下载资料 -->
      <div class="section-preview">
        <div class="section-header">
          <h2 class="section-title">下载资料</h2>
          <a href="downloads.html" class="view-more">查看更多 →</a>
        </div>
        <div class="content-list" id="downloadsList"></div>
      </div>
    </div>
  </main>

  <footer style="text-align:center;padding:24px 20px;color:var(--text-muted);font-size:13px;border-top:1px solid var(--border-color);">
    © 2026 Sahaja Yoga · Free Meditation Resources <a href="admin.html" style="color:var(--text-muted);text-decoration:none;font-size:11px;opacity:0.2;margin-left:4px;" title="">✎</a>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    // 首页初始化
    document.addEventListener('DOMContentLoaded', function() {
      loadPreviewSections();
      
      // 搜索功能
      const searchInput = document.getElementById('globalSearch');
      searchInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          globalSearch();
        }
      });
    });

    // 加载各板块预览
    function loadPreviewSections() {
      const types = ['lectures', 'videos', 'audios', 'literature', 'activities', 'downloads'];
      types.forEach(type => {
        const data = getAllData(type);
        const container = document.getElementById(type + 'List');
        if (container) {
          if (type === 'audios') {
            renderAudioList(data.slice(0, 3), container);
          } else {
            renderContentList(data.slice(0, 3), container, true, type);
          }
        }
      });
      
      // 图片预览
      const imagesData = getAllData('images');
      const imagesContainer = document.getElementById('imagesList');
      if (imagesContainer) {
        renderImagePreview(imagesData.slice(0, 4), imagesContainer);
      }
    }
    
    // 渲染音频预览列表
    function renderAudioList(items, container) {
      if (!items || items.length === 0) {
        container.innerHTML = '<div class="empty-state">暂无音频</div>';
        return;
      }
      container.innerHTML = items.map(item => `
        <div class="content-item has-audio" onclick="goToDetail('${item.id}', 'audios')">
          <div class="item-header">
            <span class="item-category">🎵 ${item.category || '冥想'}</span>
            <span class="item-date">${item.date}</span>
          </div>
          <span class="item-title">${item.title}</span>
          ${item.summary ? `<div class="item-summary">${item.summary}</div>` : ''}
        </div>
      `).join('');
    }
    
    // 渲染图片预览
    function renderImagePreview(items, container) {
      if (!items || items.length === 0) {
        container.innerHTML = '<div class="empty-state">暂无图片</div>';
        return;
      }
      container.innerHTML = items.map(item => `
        <div class="image-card-small" onclick="goToDetail('${item.id}', 'images')">
          <div class="image-thumb">
            ${item.imageUrl 
              ? `<img src="${item.imageUrl}" alt="${item.title}" onerror="this.parentElement.innerHTML='🖼️'">` 
              : '🖼️'}
          </div>
          <div class="image-info-title">${item.title}</div>
        </div>
      `).join('');
    }

    // 全局搜索
    function globalSearch() {
      const keyword = document.getElementById('globalSearch').value.trim();
      if (!keyword) return;
      
      // 跳转到搜索页面
      window.location.href = 'search.html?q=' + encodeURIComponent(keyword);
    }
  </script>
</body>
</html>
