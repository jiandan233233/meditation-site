<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>创作者中心 - SAHAJA LIVE</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header -->
  <header class="main-header">
    <div class="header-top">
      <a href="index.html" class="site-brand" style="text-decoration:none;">SAHAJA LIVE</a>
      <div class="nav-search">
        <input type="text" class="search-input" placeholder="搜索...">
        <button class="search-btn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="header-bottom">
      <div class="nav-top">
        <span class="nav-link">母亲讲话（中文字幕）</span>
        <span class="nav-link">讲话(英文字幕)</span>
        <span class="nav-link">冥想引导</span>
        <span class="nav-link">音乐音频</span>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="creator-page">
    <div class="creator-container">
      <header class="creator-header">
        <h1>🎨 创作者中心</h1>
        <p>直接发布和管理你的冥想内容，无需登录</p>
      </header>
      
      <!-- Tabs -->
      <div class="creator-tabs">
        <button class="creator-tab active" data-tab="publish">发布内容</button>
        <button class="creator-tab" data-tab="manage">内容管理</button>
      </div>
      
      <!-- Publish Panel -->
      <div class="creator-panel active" id="publish-panel">
        <div class="publish-types">
          <button class="publish-type-btn active" data-type="article">
            <svg viewBox="0 0 24 24" width="32" height="32">
              <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
            </svg>
            <span>发布文章</span>
          </button>
          <button class="publish-type-btn" data-type="video">
            <svg viewBox="0 0 24 24" width="32" height="32">
              <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
            </svg>
            <span>发布视频</span>
          </button>
        </div>
        
        <!-- Article Form -->
        <form class="creator-form" id="article-form">
          <h3 class="form-section-title">📝 发布文章</h3>
          <div class="form-group">
            <label>标题</label>
            <input type="text" name="title" placeholder="输入文章标题" required>
          </div>
          <div class="form-group">
            <label>分类</label>
            <select name="category">
              <option value="guide">入门指南</option>
              <option value="technique">冥想技巧</option>
              <option value="science">科学解读</option>
              <option value="life">生活应用</option>
            </select>
          </div>
          <div class="form-group">
            <label>封面图URL</label>
            <input type="url" name="cover" placeholder="https://...">
            <p class="form-hint">可选，不填则使用默认封面</p>
          </div>
          <div class="form-group">
            <label>正文内容</label>
            <textarea name="content" placeholder="输入文章内容..." required></textarea>
          </div>
          <div class="form-actions">
            <button type="submit" class="submit-btn">发布文章</button>
          </div>
        </form>
        
        <!-- Video Form -->
        <form class="creator-form" id="video-form" style="display:none;">
          <h3 class="form-section-title">🎬 发布视频</h3>
          <div class="form-group">
            <label>标题</label>
            <input type="text" name="title" placeholder="输入视频标题" required>
          </div>
          <div class="form-group">
            <label>分类</label>
            <select name="category">
              <option value="morning">清晨冥想</option>
              <option value="sleep">睡眠引导</option>
              <option value="anxiety">焦虑缓解</option>
              <option value="breathing">呼吸练习</option>
              <option value="body-scan">身体扫描</option>
            </select>
          </div>
          <div class="form-group">
            <label>视频嵌入链接</label>
            <input type="url" name="videoUrl" placeholder="https://www.youtube.com/embed/..." required>
            <p class="form-hint">支持 YouTube、B站等平台的嵌入链接</p>
          </div>
          <div class="form-group">
            <label>封面图URL</label>
            <input type="url" name="cover" placeholder="https://...">
          </div>
          <div class="form-group">
            <label>视频简介</label>
            <textarea name="description" placeholder="简要介绍视频内容..."></textarea>
          </div>
          <div class="form-actions">
            <button type="submit" class="submit-btn">发布视频</button>
          </div>
        </form>
      </div>
      
      <!-- Manage Panel -->
      <div class="creator-panel" id="manage-panel">
        <div class="manage-list" id="manage-list">
          <!-- 动态加载 -->
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="main-footer">
    <div class="footer-container">
      <div class="footer-logo">SAHAJA LIVE</div>
      <p class="footer-desc">免费冥想资源 · 陪你走向内心平静</p>
      <div class="footer-links">
        <a href="index.html">首页</a>
        <a href="videos.html">视频</a>
        <a href="audios.html">音频</a>
        <a href="articles.html">文章</a>
      </div>
      <p class="footer-copy">© 2024-2026 SAHAJA LIVE · 仅供学习交流使用</p>
    </div>
  </footer>

  <script src="js/creator.js"></script>
</body>
</html>
