<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片 - Sahaja Yoga</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 导航栏 -->
  <nav class="navbar">
    <a href="index.html" class="navbar-brand">SAHAJA YOGA</a>
    <button class="menu-toggle">☰</button>
    <div class="navbar-menu">
      <a href="index.html" class="nav-item">首页</a>
      <a href="lectures.html" class="nav-item">讲座</a>
      <a href="videos.html" class="nav-item">视频</a>
      <a href="audios.html" class="nav-item">音频</a>
      <a href="images.html" class="nav-item active">图片</a>
      <a href="literature.html" class="nav-item">经典文献</a>
      <a href="activities.html" class="nav-item">活动分享</a>
      <a href="downloads.html" class="nav-item">下载资料</a>
      <a href="about.html" class="nav-item">关于</a>
    </div>
  </nav>

  <!-- 主内容 -->
  <main class="main-content">
    <!-- 板块标题横幅 -->
    <div class="page-banner">
    </div>

    <div class="container">
      <!-- 说明文字 -->
      <p class="section-desc">欣赏精美的冥想相关图片，包括圣地风景、姿势图解、曼陀罗图案等。</p>

      <!-- 搜索框 -->
      <div class="search-box">
        <input type="text" class="search-input" id="searchInput" placeholder="搜索图片标题或关键词...">
        <button class="search-btn" onclick="performSearch('images')">搜索</button>
      </div>

      <!-- 分类筛选 -->
      <div class="filter-bar">
        <div class="filter-tags" id="filterTags"></div>
        <button class="theme-toggle" onclick="toggleTheme()">🌓 暗黑模式</button>
      </div>

      <!-- 图片网格 -->
      <div class="image-grid" id="imageGrid"></div>

      <!-- 分页 -->
      <div class="pagination" id="pagination"></div>
    </div>
  </main>

  <footer style="text-align:center;padding:24px 20px;color:var(--text-muted);font-size:13px;border-top:1px solid var(--border-color);">
    © 2026 Sahaja Yoga · Free Meditation Resources <a href="admin.html" style="color:var(--text-muted);text-decoration:none;font-size:11px;opacity:0.2;margin-left:4px;" title="">✎</a>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    const PAGE_SIZE = 12;
    let currentPage = 1;
    let filteredData = [];

    document.addEventListener('DOMContentLoaded', function() {
      initPage();
    });

    function initPage() {
      const data = getAllData('images');
      filteredData = data;
      
      // 渲染分类标签
      const categories = getCategories('images');
      renderFilterTags(categories, document.getElementById('filterTags'), filterByCategory);
      
      // 渲染列表
      renderPage(1);
      
      // 搜索功能
      document.getElementById('searchInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          performSearch('images');
        }
      });
    }

    function filterByCategory(category) {
      if (!category) {
        filteredData = getAllData('images');
      } else {
        filteredData = getAllData('images').filter(item => item.category === category);
      }
      renderPage(1);
    }

    function performSearch(type) {
      const keyword = document.getElementById('searchInput').value.trim();
      filteredData = searchData(type, keyword);
      renderPage(1);
    }

    function renderPage(page) {
      currentPage = page;
      const start = (page - 1) * PAGE_SIZE;
      const end = start + PAGE_SIZE;
      const pageData = filteredData.slice(start, end);
      
      const container = document.getElementById('imageGrid');
      if (pageData.length === 0) {
        container.innerHTML = '<div class="empty-state">暂无图片</div>';
      } else {
        renderImageGrid(pageData, container);
      }
      
      renderPagination(filteredData.length, page, PAGE_SIZE, document.getElementById('pagination'), renderPage);
    }

    // 渲染图片网格
    function renderImageGrid(items, container) {
      if (!container) return;
      
      if (!items || items.length === 0) {
        container.innerHTML = '<div class="empty-state">暂无图片</div>';
        return;
      }

      container.innerHTML = items.map(item => `
        <div class="image-card" onclick="goToDetail('${item.id}', 'images')">
          <div class="image-thumb">
            ${item.imageUrl 
              ? `<img src="${item.imageUrl}" alt="${item.title}" onerror="this.parentElement.innerHTML='🖼️'">` 
              : '🖼️'}
          </div>
          <div class="image-info">
            <div class="image-info-title">${item.title}</div>
            <div class="image-info-date">${item.date}</div>
          </div>
        </div>
      `).join('');
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      if (current === 'dark') {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
      }
    }
  </script>
</body>
</html>
