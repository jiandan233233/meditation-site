  <!-- 主内容 -->
  <main class="main-content">
    <div class="page-banner"></div>

    <div class="container">
      <p class="section-desc">跟随引导进入深度冥想，体验内在的平静与觉醒。</p>

      <div class="search-box">
        <input type="text" class="search-input" id="searchInput" placeholder="搜索冥想引导标题或关键词...">
        <button class="search-btn" onclick="performSearch('meditation_guide')">搜索</button>
      </div>

      <div class="filter-bar">
        <div class="filter-tags" id="filterTags"></div>
        <button class="theme-toggle" onclick="toggleTheme()">🌓 暗黑模式</button>
      </div>

      <div id="loadingState" style="text-align:center;padding:40px;color:var(--text-muted);">
        ⏳ 正在加载内容...
      </div>

      <div class="content-list" id="contentList" style="display:none;"></div>

      <div class="pagination" id="pagination"></div>
    </div>
  </main>

  <footer style="text-align:center;padding:24px 20px;color:var(--text-muted);font-size:13px;border-top:1px solid var(--border-color);">
    © 2026 Sahaja Yoga · Free Meditation Resources <a href="admin.html" style="color:var(--nav-blue);text-decoration:none;font-size:13px;margin-left:8px;" title="创作者工作台">✎ 创作者入口</a>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    const PAGE_SIZE = 10;
    let currentPage = 1;
    let filteredData = [];
    let allCategories = [];

    document.addEventListener('DOMContentLoaded', function() {
      initPage();
    });

    async function initPage() {
      try {
        const content = await fetchContentJson();
        const data = content.meditation_guide || [];
        
        saveAllData('meditation_guide', data);
        filteredData = data;
        allCategories = getCategories('meditation_guide');
        
        renderFilterTags(allCategories, document.getElementById('filterTags'), filterByCategory);
        
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('contentList').style.display = 'block';
        
        renderPage(1);
      } catch (e) {
        console.error('加载失败:', e);
        document.getElementById('loadingState').innerHTML = '⚠️ 加载失败，请刷新重试';
      }
      
      document.getElementById('searchInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          performSearch('meditation_guide');
        }
      });
    }

    function filterByCategory(category) {
      if (!category) {
        filteredData = getAllData('meditation_guide');
      } else {
        filteredData = getAllData('meditation_guide').filter(item => item.category === category);
      }
      renderPage(1);
    }

    function performSearch(type) {
      const keyword = document.getElementById('searchInput').value.trim();
      filteredData = searchData(type, keyword);
      renderPage(1);
    }

    function renderPage(page) {
      currentPage = page;
      const start = (page - 1) * PAGE_SIZE;
      const end = start + PAGE_SIZE;
      const pageData = filteredData.slice(start, end);
      
      const container = document.getElementById('contentList');
      if (pageData.length === 0) {
        container.innerHTML = '<div class="empty-state">暂无内容</div>';
      } else {
        renderContentListWithVideo(pageData, container);
      }
      
      renderPagination(filteredData.length, page, PAGE_SIZE, document.getElementById('pagination'), renderPage);
    }

    function renderContentListWithVideo(items, container) {
      if (!container) return;
      
      if (!items || items.length === 0) {
        container.innerHTML = '<div class="empty-state">暂无内容</div>';
        return;
      }

      container.innerHTML = items.map(item => `
        <div class="content-item has-video" onclick="goToDetail('${item.id}', 'meditation_guide')">
          <div class="item-header">
            <span class="item-category">🧘 ${item.category || '冥想引导'}</span>
            <span class="item-date">${item.date}</span>
          </div>
          <span class="item-title">${item.title}</span>
          ${item.summary ? `<div class="item-summary">${item.summary}</div>` : ''}
        </div>
      `).join('');
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      if (current === 'dark') {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
      }
    }
  </script>
</body>
