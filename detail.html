    <div class="navbar-menu">
      <a href="index.html" class="nav-item">首页</a>

  </nav>

  <main class="detail-container">
    <!-- 面包屑 -->
    <div class="breadcrumb" id="breadcrumb">
      <a href="index.html">首页</a> &gt; <span id="breadcrumb-category">加载中...</span>
    </div>

    <!-- 标题区 -->
    <div class="detail-header">
      <h1 class="detail-title" id="detail-title">加载中...</h1>
      <div class="detail-meta" id="detail-meta">
        <span class="detail-date" id="detail-date"></span>
        <span class="detail-category" id="detail-category"></span>
      </div>
    </div>

    <!-- 视频区 -->
    <div class="detail-video" id="detail-video" style="display:none;">

    <div class="comment-section">

        <input type="text" class="comment-nickname" id="comment-nickname" placeholder="你的昵称">

        <button class="comment-submit" id="comment-submit">留言</button>
      </div>
      <div class="comment-list" id="comment-list">
        <!-- 评论列表 -->
      </div>
    </div>

  <footer style="text-align:center;padding:24px 20px;color:var(--text-muted);font-size:13px;border-top:1px solid var(--border-color);">
