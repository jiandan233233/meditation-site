<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音频 - Sahaja Yoga</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 导航栏 -->
  <nav class="navbar">
    <a href="index.html" class="navbar-brand">SAHAJA YOGA</a>
    <button class="menu-toggle">☰</button>
    <div class="navbar-menu">
      <a href="index.html" class="nav-item">首页</a>
      <a href="lectures.html" class="nav-item">讲座</a>
      <a href="videos.html" class="nav-item">视频</a>
      <a href="audios.html" class="nav-item active">音频</a>
      <a href="images.html" class="nav-item">图片</a>
      <a href="literature.html" class="nav-item">经典文献</a>
      <a href="activities.html" class="nav-item">活动分享</a>
      <a href="downloads.html" class="nav-item">下载资料</a>
      <a href="about.html" class="nav-item">关于</a>
    </div>
  </nav>

  <!-- 主内容 -->
  <main class="main-content">
    <div class="page-banner"></div>
    <div class="container">
      <p class="section-desc">聆听冥想引导音频，随时随地跟随练习，获得身心的放松与平静。</p>

      <div class="search-box">
        <input type="text" class="search-input" id="searchInput" placeholder="搜索音频标题或关键词...">
        <button class="search-btn" onclick="performSearch('audios')">搜索</button>
      </div>

      <div class="filter-bar">
        <div class="filter-tags" id="filterTags"></div>
        <button class="theme-toggle" onclick="toggleTheme()">🌓 暗黑模式</button>
      </div>

      <div id="loadingState" style="text-align:center;padding:40px;color:var(--text-muted);">⏳ 正在加载...</div>
      <div class="content-list" id="contentList" style="display:none;"></div>
      <div class="pagination" id="pagination"></div>
    </div>
  </main>

  <footer style="text-align:center;padding:24px 20px;color:var(--text-muted);font-size:13px;border-top:1px solid var(--border-color);">
    © 2026 Sahaja Yoga · Free Meditation Resources <a href="admin.html" style="color:var(--nav-blue);text-decoration:none;font-size:13px;margin-left:8px;" title="创作者工作台">✎ 创作者入口</a>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    const PAGE_SIZE = 10;
    let currentPage = 1;
    let filteredData = [];

    document.addEventListener('DOMContentLoaded', function() {
      initPage();
    });

    async function initPage() {
      try {
        const content = await fetchContentJson();
        const data = content.audios || [];
        saveAllData('audios', data);
        filteredData = data;
        
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('contentList').style.display = 'block';
        
        const categories = getCategories('audios');
        renderFilterTags(categories, document.getElementById('filterTags'), filterByCategory);
        renderPage(1);
      } catch (e) {
        document.getElementById('loadingState').innerHTML = '⚠️ 加载失败';
      }

      document.getElementById('searchInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') performSearch('audios');
      });
    }

    function filterByCategory(category) {
      filteredData = category ? getAllData('audios').filter(item => item.category === category) : getAllData('audios');
      renderPage(1);
    }

    function performSearch(type) {
      filteredData = searchData(type, document.getElementById('searchInput').value.trim());
      renderPage(1);
    }

    function renderPage(page) {
      currentPage = page;
      const start = (page - 1) * PAGE_SIZE;
      const pageData = filteredData.slice(start, start + PAGE_SIZE);
      renderAudioList(pageData, document.getElementById('contentList'));
      renderPagination(filteredData.length, page, PAGE_SIZE, document.getElementById('pagination'), renderPage);
    }

    function renderAudioList(items, container) {
      if (!items || items.length === 0) {
        container.innerHTML = '<div class="empty-state">暂无音频</div>';
        return;
      }
      container.innerHTML = items.map(item => `
        <div class="content-item has-audio" onclick="goToDetail('${item.id}', 'audios')">
          <div class="item-header">
            <span class="item-category">🎵 ${item.category || '冥想'}</span>
            <span class="item-date">${item.date}</span>
          </div>
          <span class="item-title">${item.title}</span>
          ${item.summary ? `<div class="item-summary">${item.summary}</div>` : ''}
        </div>
      `).join('');
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      document.documentElement[current === 'dark' ? 'removeAttribute' : 'setAttribute']('data-theme', 'dark');
      localStorage.setItem('theme', current === 'dark' ? 'light' : 'dark');
    }
  </script>
</body>
</html>
