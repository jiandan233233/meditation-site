  <main class="main-content">
    <div class="page-banner"></div>
    <div class="container">
      <p class="section-desc">获取冥想学习资料，包括PDF手册、音频文件和参考图片。</p>

      <div class="search-box">
        <input type="text" class="search-input" id="searchInput" placeholder="搜索资料名称或类型...">
        <button class="search-btn" onclick="performSearch('downloads')">搜索</button>
      </div>

      <div class="filter-bar">
        <div class="filter-tags" id="filterTags"></div>
        <button class="theme-toggle" onclick="toggleTheme()">🌓 暗黑模式</button>
      </div>

      <div id="loadingState" style="text-align:center;padding:40px;color:var(--text-muted);">⏳ 正在加载...</div>
      <div class="content-list" id="contentList" style="display:none;"></div>
      <div class="pagination" id="pagination"></div>
    </div>
  </main>

  <footer style="text-align:center;padding:24px 20px;color:var(--text-muted);font-size:13px;border-top:1px solid var(--border-color);">
    © 2026 Sahaja Yoga · Free Meditation Resources <a href="admin.html" style="color:var(--nav-blue);text-decoration:none;font-size:13px;margin-left:8px;" title="创作者工作台">✎ 创作者入口</a>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    const PAGE_SIZE = 10;
    let currentPage = 1;
    let filteredData = [];

    document.addEventListener('DOMContentLoaded', function() {
      initPage();
    });

    async function initPage() {
      try {
        const content = await fetchContentJson();
        const data = content.downloads || [];
        saveAllData('downloads', data);
        filteredData = data;
        
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('contentList').style.display = 'block';
        
        const categories = getCategories('downloads');
        renderFilterTags(categories, document.getElementById('filterTags'), filterByCategory);
        renderPage(1);
      } catch (e) {
        document.getElementById('loadingState').innerHTML = '⚠️ 加载失败';
      }

      document.getElementById('searchInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') performSearch('downloads');
      });
    }

    function filterByCategory(category) {
      filteredData = category ? getAllData('downloads').filter(item => item.category === category) : getAllData('downloads');
      renderPage(1);
    }

    function performSearch(type) {
      filteredData = searchData(type, document.getElementById('searchInput').value.trim());
      renderPage(1);
    }

    function renderPage(page) {
      currentPage = page;
      const start = (page - 1) * PAGE_SIZE;
      const pageData = filteredData.slice(start, start + PAGE_SIZE);
      renderContentList(pageData, document.getElementById('contentList'), true, 'downloads');
      renderPagination(filteredData.length, page, PAGE_SIZE, document.getElementById('pagination'), renderPage);
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      document.documentElement[current === 'dark' ? 'removeAttribute' : 'setAttribute']('data-theme', 'dark');
      localStorage.setItem('theme', current === 'dark' ? 'light' : 'dark');
    }
  </script>
